<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Buddy — Your Homework Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #1b3a2f;
    --board-dark: #142d24;
    --board-darker: #0f221b;
    --chalk: #f4f1e6;
    --chalk-dim: #b9c9c0;
    --yellow: #e8c468;
    --yellow-bright: #f2d488;
    --pink: #e08fa0;
    --teal: #6fae9f;
    --line: rgba(244,241,230,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--board);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--chalk);
  }
  body {
    background-image:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,0.035) 0, transparent 38%),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(232,196,104,0.04) 0, transparent 45%);
  }
  .doodle {
    position: fixed;
    font-family: 'Kalam', cursive;
    color: rgba(244,241,230,0.08);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .app {
    max-width: 820px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 20px 20px;
    position: relative;
    z-index: 1;
  }
  .hero {
    text-align: center;
    padding: 18px 10px 26px;
    animation: fadeUp 0.6s ease both;
  }
  .hero-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--teal);
    background: rgba(111,174,159,0.12);
    border: 1px solid rgba(111,174,159,0.35);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  h1.title {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    margin: 0 0 6px;
    color: var(--yellow-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
    line-height: 1.05;
  }
  h1.title span { color: var(--chalk); }
  .subhead {
    font-size: 1rem;
    color: var(--chalk-dim);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.55;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .subjects {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 4px;
    animation: fadeUp 0.6s ease 0.15s both;
  }
  .tab {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 20px;
    background: var(--board-dark);
    border: 1px solid var(--line);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.83rem;
    font-weight: 500;
    color: var(--chalk-dim);
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .tab:hover { color: var(--chalk); border-color: var(--teal); transform: translateY(-1px); }
  .tab.active {
    background: var(--teal);
    color: var(--board-darker);
    font-weight: 700;
    border-color: var(--teal);
    box-shadow: 0 3px 10px rgba(111,174,159,0.35);
  }
  .starters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 16px;
  }
  .starter-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    color: var(--yellow-bright);
    background: rgba(232,196,104,0.08);
    border: 1px solid rgba(232,196,104,0.3);
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .starter-chip:hover {
    background: rgba(232,196,104,0.16);
    transform: translateY(-1px);
  }
  .chat-window {
    flex: 1;
    background: rgba(244,241,230,0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 340px;
    max-height: 50vh;
  }
  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 4px;
    line-height: 1.55;
    font-size: 0.95rem;
    position: relative;
    white-space: pre-wrap;
    animation: popIn 0.25s ease both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--yellow);
    color: var(--board-darker);
    border-radius: 12px 12px 3px 12px;
    font-weight: 500;
  }
  .msg.bot {
    align-self: flex-start;
    background: #fdfbf3;
    color: #26362f;
    border-radius: 12px 12px 12px 3px;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.22);
  }
  .msg.bot::before {
    content: '';
    position: absolute;
    top: -3px; left: 16px; right: 16px;
    height: 4px;
    background: repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(0,0,0,0.06) 6px, rgba(0,0,0,0.06) 10px);
  }
  .msg.system {
    align-self: center;
    color: var(--chalk-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    text-align: center;
    max-width: 100%;
  }
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    background: #26362f;
    border-radius: 50%;
    opacity: 0.4;
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  .composer {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  textarea#input {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(244,241,230,0.04);
    color: var(--chalk);
    padding: 13px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    min-height: 48px;
    max-height: 120px;
    transition: border-color 0.15s ease;
  }
  textarea#input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(111,174,159,0.15); }
  button#send {
    background: var(--yellow);
    color: var(--board-darker);
    border: none;
    border-radius: 10px;
